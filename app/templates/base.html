<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Contactos{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="{{ url_for('clientes.index') }}" class="text-lg font-semibold text-teal-800">Agenda de contactos</a>
      <a href="{{ url_for('clientes.nuevo') }}"
         class="bg-teal-700 hover:bg-teal-800 text-white text-sm font-medium px-4 py-2 rounded-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
        Nuevo contacto
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <p data-flash role="status"
           class="mb-4 rounded-md px-4 py-3 text-sm {{ 'bg-teal-50 text-teal-900 border border-teal-200' if categoria == 'ok' else 'bg-red-50 text-red-800 border border-red-200' }}">
          {{ mensaje }}
        </p>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
